name: Build Android Debug APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"
          yes | sdkmanager --licenses || true
      - name: Install Godot and export templates (4.7)
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
          sudo mv Godot_v4.7-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -qo Godot_v4.7-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.stable/
      - name: Configure Android export
        run: |
          mkdir -p build/android
          godot --headless --path . --editor --quit
      - name: Export Android debug (signing must be verified)
        run: godot --headless --path . --export-debug "Android" build/android/lifesim-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lifesim-android-debug
          path: build/android/*.apk
          if-no-files-found: error
          retention-days: 1
