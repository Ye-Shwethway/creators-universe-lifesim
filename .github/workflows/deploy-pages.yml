name: Deploy Web to Cloudflare Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Web"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Install Godot 4.7.2 and templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable /tmp/godot-templates
          unzip -qo Godot_v4.7.2-stable_export_templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Build Web
        run: |
          godot --headless --path . --editor --quit
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
      - name: Split WebAssembly into Pages-safe assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          wasm = Path("build/web/index.wasm")
          size = wasm.stat().st_size
          print(f"Original WASM size: {size} bytes")
          chunks = Path("build/web/wasm-chunks")
          chunks.mkdir(parents=True, exist_ok=True)
          names = []
          with wasm.open("rb") as source:
              index = 0
              while block := source.read(12 * 1024 * 1024):
                  name = f"part-{index:03d}.bin"
                  (chunks / name).write_bytes(block)
                  names.append(name)
                  index += 1
          (chunks / "manifest.json").write_text(json.dumps({"parts": names, "total_bytes": size}))
          wasm.unlink()
          assert all((chunks / name).stat().st_size <= 25 * 1024 * 1024 for name in names)
          print(f"Split WASM into {len(names)} chunks")
          PY
      - name: Publish to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy build/web --project-name creators-universe-lifesim --branch main
