name: Validate Godot Project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and parse project
        run: godot --headless --path . --editor --quit
      - name: Test project startup
        run: godot --headless --path . --quit-after 3
      - name: CI-only action/save/character regression
        run: |
          godot --headless --path . --script res://tests/runtime_regression.gd 2>&1 | tee /tmp/lifesim-regression.log
          grep -q 'LIFESIM_QA_RESULT failures=0' /tmp/lifesim-regression.log
