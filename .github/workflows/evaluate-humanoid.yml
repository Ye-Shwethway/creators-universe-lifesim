name: Evaluate CC0 Humanoid Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download candidate without publishing to the game
        run: |
          mkdir -p /tmp/lifesim-candidate
          curl --fail --location --retry 3 --max-time 90 --output /tmp/lifesim-candidate/humanoid.glb \
            https://raw.githubusercontent.com/nirholas/three.ws/main/public/avatars/parametric-base.glb
          ls -lh /tmp/lifesim-candidate/humanoid.glb
          sha256sum /tmp/lifesim-candidate/humanoid.glb
      - name: Inspect actual candidate metadata
        run: |
          python tools/audit_gltf.py /tmp/lifesim-candidate/humanoid.glb --require-rig --require-four-morphs | tee /tmp/lifesim-candidate/audit.json
      - name: Install Godot and matching templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Normalize sparse GLB accessors with Blender roundtrip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
          cat > /tmp/lifesim-candidate/roundtrip.py <<'PY'
          import bpy
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath="/tmp/lifesim-candidate/humanoid.glb")
          bpy.ops.export_scene.gltf(filepath="/tmp/lifesim-candidate/normalized.glb", export_format="GLB", export_morph=True, export_skins=True, export_animations=True)
          PY
          blender -b -t 2 --python /tmp/lifesim-candidate/roundtrip.py
          test -s /tmp/lifesim-candidate/normalized.glb
          python tools/audit_gltf.py /tmp/lifesim-candidate/normalized.glb --require-rig --require-four-morphs | tee /tmp/lifesim-candidate/normalized-audit.json
      - name: Godot GLB importer smoke
        run: |
          mkdir -p assets/public/candidates
          cp /tmp/lifesim-candidate/normalized.glb assets/public/candidates/humanoid.glb
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/lifesim-candidate/godot-import.log
          test -d .godot/imported
          if grep -Eiq "ERROR:|Parse Error|Failed to import|Sparse indices buffer view size" /tmp/lifesim-candidate/godot-import.log; then
            echo "Godot import reported errors; candidate REJECTED for production"
            exit 1
          fi
      - name: Instantiate Godot imported scene and inspect rig
        run: |
          godot --headless --path . --script res://tools/inspect_humanoid.gd 2>&1 | tee /tmp/lifesim-candidate/runtime-inspection.log
          if grep -Eiq "ERROR:|Parse Error|SCRIPT ERROR" /tmp/lifesim-candidate/runtime-inspection.log; then
            echo "Character scene inspection detected runtime errors"
            exit 1
          fi
          grep -q 'LIFESIM_HUMANOID_INSPECT' /tmp/lifesim-candidate/runtime-inspection.log
      - name: Render isolated neutral and physique QA images
        run: |
          blender -b -t 2 --python tools/render_humanoid.py 2>&1 | tee /tmp/lifesim-candidate/render.log
          test -s /tmp/lifesim-candidate/humanoid-neutral.png
          test -s /tmp/lifesim-candidate/humanoid-shoulders.png
          test -s /tmp/lifesim-candidate/humanoid-chest.png
          test -s /tmp/lifesim-candidate/humanoid-arms.png
      - name: Upload isolated character renders for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-visual-qa
          path: /tmp/lifesim-candidate/humanoid-*.png
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload audit report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-candidate-report
          path: /tmp/lifesim-candidate/audit.json
          if-no-files-found: ignore
          retention-days: 1
